name: "noah-ruben.de"
services:
  website:
    profiles: [website]
    image: "website:latest"
    depends_on:
      wiremock-website:
        condition: service_healthy
    environment:
      GITHUB_URL: "http://wiremock-website:8080"
      CV_PATH: "/cv"
      OTEL_SERVICE_NAME: "noah-ruben.de"
      OTEL_JAVAAGENT_LOGGING: "application"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
    ports:
      - "42081:42081"
    volumes:
      - ${CV_DIR:-/Users/i13az81/dev/uni/pers/cv/out}:/cv
    env_file:
        - ${ENV_FILE:-.env}
  wiremock-website:
    image: "wiremock/wiremock:latest"
    container_name: wiremock-website
    entrypoint: ["/docker-entrypoint.sh", "--global-response-templating", "--disable-gzip", "--verbose"]
    volumes:
      - ../wm:/home/wiremock
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/__admin/mappings"]
      interval: 5s
      timeout: 3s
      retries: 20
  elasticsearch:
    profiles: [observability]
    image: "docker.elastic.co/elasticsearch/elasticsearch:9.3.3"
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
  kibana:
    profiles: [observability]
    image: "docker.elastic.co/kibana/kibana:9.3.3"
    depends_on:
      elasticsearch:
        condition: service_started
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
  edot-collector:
    profiles: [observability]
    image: "docker.elastic.co/elastic-agent/elastic-agent:9.3.3"
    command: ["--config", "/etc/otelcol-config.yml"]
    depends_on:
      elasticsearch:
        condition: service_started
    environment:
      ELASTIC_AGENT_OTEL: "true"
      ELASTIC_ENDPOINT: "http://elasticsearch:9200"
      STORAGE_DIR: "/usr/share/elastic-agent"
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./edot-collector-config.yml:/etc/otelcol-config.yml:ro

volumes:
  elasticsearch-data:
