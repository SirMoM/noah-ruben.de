name: "noah-ruben.de"
services:
  website:
    profiles: [website]
    image: "website:latest"
    depends_on:
      wiremock-website:
        condition: service_healthy
    environment:
      GITHUB_URL: "http://wiremock-website:8080"
      CV_PATH: "/cv"
    ports:
      - "42081:42081"
    volumes:
      - ${CV_ENG_DIR:-/Users/i13az81/dev/uni/pers/cv/out/eng}:/cv/eng:ro
      - ${CV_GER_DIR:-/Users/i13az81/dev/uni/pers/cv/out/ger}:/cv/ger:ro
    env_file:
        - ${ENV_FILE:-.env}
  wiremock-website:
    image: "wiremock/wiremock:latest"
    container_name: wiremock-website
    entrypoint: ["/docker-entrypoint.sh", "--global-response-templating", "--disable-gzip", "--verbose"]
    volumes:
      - ../wm:/home/wiremock
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/__admin/mappings"]
      interval: 5s
      timeout: 3s
      retries: 20
