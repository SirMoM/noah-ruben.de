name: Continuous Integration/Testing
"on":
  push:
    branches:
      - main
      - dud
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
concurrency:
  group: "ci"
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ktlint:
    runs-on: ubuntu-22.04
    env:
      KTLINT_VERSION: 1.8.0
      KTLINT_BIN_DIR: ${{ runner.temp }}/ktlint
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Cache Amper bootstrap
        uses: actions/cache@v5
        with:
          path: ~/.cache/JetBrains/Amper
          key: ${{ runner.os }}-amper-${{ hashFiles('amper', 'module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-amper-
      - name: Cache ktlint
        id: cache-ktlint
        uses: actions/cache@v5
        with:
          path: ${{ env.KTLINT_BIN_DIR }}
          key: ${{ runner.os }}-ktlint-${{ env.KTLINT_VERSION }}
      - name: Install ktlint
        if: steps.cache-ktlint.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${KTLINT_BIN_DIR}"
          curl -sSL -o "${KTLINT_BIN_DIR}/ktlint" "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod a+x "${KTLINT_BIN_DIR}/ktlint"
      - name: Add ktlint to PATH
        run: echo "${KTLINT_BIN_DIR}" >> $GITHUB_PATH
      - name: Grant execute permission for Amper wrapper
        run: chmod +x amper
      - name: Run ktlint via Amper
        run: ./amper task :noah-ruben.de:ktlint@ktlint
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Cache Amper bootstrap
        uses: actions/cache@v5
        with:
          path: ~/.cache/JetBrains/Amper
          key: ${{ runner.os }}-amper-${{ hashFiles('amper', 'module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-amper-
      - name: Grant execute permission for Amper wrapper
        run: chmod +x amper
      - name: Build with Amper
        run: ./amper build
      - name: Run tests with Amper
        run: ./amper test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: build/reports/noah-ruben.de/jvm/
