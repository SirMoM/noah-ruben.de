name: Continuous Integration/Testing
"on":
  push:
    branches:
      - main
      - dud
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
concurrency:
  group: "ci"
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ktlint:
    runs-on: ubuntu-22.04
    env:
      KTLINT_VERSION: 1.8.0
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Cache ktlint
        id: cache-ktlint
        uses: actions/cache@v5
        with:
          path: ./.cache/ktlint
          key: ubuntu-22.04-ktlint-${{ env.KTLINT_VERSION }}
      - name: Install ktlint
        if: steps.cache-ktlint.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.cache/ktlint
          curl -sSL -o ./.cache/ktlint/ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod a+x ./.cache/ktlint/ktlint
      - name: Add ktlint to PATH
        run: echo "${GITHUB_WORKSPACE}/.cache/ktlint" >> $GITHUB_PATH
      - name: Run ktlint
        run: |
          set +e
          output_file="$(mktemp)"
          ktlint --color --reporter plain -F --editorconfig .editorconfig --relative 'src/**/*.kt' '!src/main/kotlin/com/dvag/noah/ruben/generated/**' 2>&1 | tee "$output_file"
          ktlint_exit_code=${PIPESTATUS[0]}

          if [ "$ktlint_exit_code" -eq 0 ]; then
            echo "### ktlint" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ktlint" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Failed with exit code $ktlint_exit_code." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>ktlint output</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat "$output_file" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

          exit "$ktlint_exit_code"
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Cache Amper bootstrap
        uses: actions/cache@v5
        with:
          path: ~/.cache/JetBrains/Amper
          key: ${{ runner.os }}-amper-${{ hashFiles('amper', 'module.yaml') }}
          restore-keys: |
            ${{ runner.os }}-amper-
      - name: Grant execute permission for Amper wrapper
        run: chmod +x amper
      - name: Build with Amper
        run: ./amper build
      - name: Run tests with Amper
        run: ./amper test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: build/reports/noah-ruben.de/jvm/
